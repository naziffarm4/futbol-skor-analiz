name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt ruff mypy

      - name: Run Ruff linter
        run: ruff check engine app.py

      - name: Run Mypy type checker
        run: mypy engine/bulletin.py engine/scrapers/pipeline.py app.py

      - name: Run Python unit tests
        run: python -m unittest discover -s engine/tests -v
